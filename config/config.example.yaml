# JobLens minimal configuration example
#
# This is a template — copy to config.yaml and modify for your environment.
# Full configuration reference: https://github.com/joblens-org/JobLens/blob/main/doc/configuration.md
#
# 敏感值（ES 口令等）不要明文写入本文件。C++ 配置支持环境变量占位符：
#   passwd: "{{ES_PASSWORD}}"
# 由 systemd 的 EnvironmentFile=/etc/JobLens/secrets.env（0600 root）提供。
#
# Start command: ./JobLens -m service -c config/config.yaml

# ============================================================
# Core Configuration (required)
# ============================================================
lens_config:
  rpc_socket_path: /var/JobLens/rpc.sock   # UNIX Domain Socket path for RPC communication
  lock_path: /var/JobLens/JobLens.lock     # Process lock file to prevent multiple instances
  max_collector_threads: 4                   # Thread pool size for collector scheduler
  log_level: info                            # Log level: trace/debug/info/warn/error/critical/off

# ============================================================
# Job Registry Configuration
# ============================================================
job_registry_config:
  job_db_path: /var/JobLens/job.db          # LevelDB database directory for job persistence
  # Discovery and maintenance. `auto_discovery_types` arms the discovery
  # watchers: an absent list means [] (no watcher starts, no manager pass
  # scans). Every registered scheduler adapter is assembled regardless, so a
  # job registered another way (Trigger / RPC / restored row) still gets its
  # typed facts, refresh and kernel attribution. The former `types` key was
  # renamed; a configuration that still carries it is rejected at startup.
  # `reconcile_interval_sec` defaults to 30 and must be >= 1; invalid values
  # are rejected at startup. `capture_all` (default true) registers every
  # captured job unconditionally; when false, registration is decided by the
  # type's `<type>_job_watcher.auto_add`.
  auto_discovery_types: [condor, slurm]
  reconcile_interval_sec: 30
  capture_all: true

# Scheduler discovery. Listing a type under
# job_registry_config.auto_discovery_types maintains every recognized local
# instance. `auto_add` is the tri-state automatic path:
#   off     - never select collectors automatically (the job still registers
#             when capture_all is true);
#   default - apply auto_add_collectors verbatim to every new job;
#   rule    - let the Lua rule engine decide per job (first accepting rule wins;
#             an accept without a collector list falls back to
#             auto_add_collectors).
# The legacy auto_collect/use_rules pair is accepted as a mapping source when
# auto_add is absent.
# The rule file prefix is the adapter name itself (condor*, slurm*): a rule
# file belongs to a type only when its basename starts with that name, so a
# shared rules directory can never feed one type's rules into another.
condor_job_watcher:
  auto_add: rule
  rules_dir: /etc/JobLens/rules/condor_jobs
  auto_add_collectors: [cpumem_collector]

slurm_job_watcher:
  auto_add: off
  rules_dir: /etc/JobLens/rules/slurm_jobs
  auto_add_collectors: [cpumem_collector]

# ============================================================
# Collector Configuration — cpumem only
# ============================================================
collectors_config:
  enable_collector_perf: false               # Disable collector performance counters
  perf_window_size: 1000                     # Required when enable_collector_perf=true
  default_freq: 1                            # Default sampling frequency (Hz)
  default_use_writers:                       # Default writer list, used when collector doesn't specify
    - file_writer
  collectors:
    - name: cpumem_collector
      type: CPUMemCollector
      config: cpumem_collector_config
    # - name: new_io_usage
    #   type: NewIOUsageCollector
    #   config: new_io_usage_config

cpumem_collector_config:
  freq: 1                                    # Sample once per second
  summary: false                             # false = per-process, true = aggregate summary
  pss: true                                  # Collect PSS (Proportional Set Size); false disables /proc/<pid>/smaps_rollup reads
  pss_fallback_smaps: true                   # Kernels without smaps_rollup fall back to per-VMA smaps parsing
  pss_max_processes: 64                      # Skip PSS for jobs with more live pids (0 = unlimited)
  # Explicit output routing: channel -> writer instances.
  # Channels declared by CPUMemCollector: document, text, metrics.
  # Omitted channels are disabled; an empty list disables that channel.
  outputs:
    text:
      - file_writer                          # Output prepared plain text to local file
  # Legacy form (mutually exclusive with 'outputs'); still accepted during migration:
  # use_writers:
  #   - file_writer

# ============================================================
# Writer Configuration — FileWriter only
# ============================================================
writers_config:
  enable_writer_perf: false                  # Disable writer performance counters
  buffer_capacity: 1024                      # Reserve capacity per flush buffer (not a hard queue limit)
  max_pending_records: 4096                  # Hard bound: records pending in front/back buffers
  max_pending_bytes: 67108864                # Hard bound: accounted payload+metadata bytes (64 MiB)
  max_record_bytes: 8388608                  # Reject a single record larger than this (8 MiB)
  writers:
    - name: file_writer
      type: FileWriter
      config: file_writer_config

file_writer_config:
  path: /var/log/joblens/output.log          # Default output file path (required)
  # --- Optional controls (all have defaults, shown below are the defaults) ---
  # write_mode: append                       # Write mode: 'append' (default) or 'overwrite'
  # flush_on_shutdown: true                  # Flush remaining records on graceful shutdown
  # enable_rotation: false                   # Enable size-based file rotation (append mode only)
  # max_file_size_bytes: 104857600           # Rotation threshold in bytes (100 MB)
  # max_files: 5                             # Maximum rotated files to retain
  # --- Collector-to-file routing (optional; parser output is written as plain text) ---
  # outputs: []                              # Empty or omitted means all collectors use 'path'
  # outputs:
  #   - collector_name: cpumem_collector
  #     file_path: /var/log/joblens/cpumem.log

